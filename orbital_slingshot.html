<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Orbital Slingshot</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    /* Prevent text selection and default touch actions */
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
}

body, html {
    width: 100%;
    height: 100%;
    background-color: #050510;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: white;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

#uiContainer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none; /* Let clicks pass through to canvas when appropriate */
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

#scoreDisplay {
    position: absolute;
    top: 20px;
    left: 20px;
    font-size: 24px;
    font-weight: bold;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
}

#gameOverScreen, #startScreen {
    background-color: rgba(5, 5, 16, 0.85);
    padding: 40px;
    border-radius: 15px;
    text-align: center;
    pointer-events: auto; /* Catch clicks for buttons */
    border: 2px solid rgba(0, 255, 255, 0.3);
    box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
    backdrop-filter: blur(5px);
}

h1 {
    font-size: 36px;
    margin-bottom: 20px;
    color: #00ffff;
    text-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
}

p {
    font-size: 18px;
    margin-bottom: 30px;
    line-height: 1.5;
    color: #cccccc;
}

button {
    background: transparent;
    border: 2px solid #00ffff;
    color: #00ffff;
    padding: 15px 30px;
    font-size: 20px;
    font-weight: bold;
    border-radius: 30px;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    letter-spacing: 2px;
    box-shadow: 0 0 15px rgba(0, 255, 255, 0.3) inset, 0 0 15px rgba(0, 255, 255, 0.3);
}

button:hover, button:active {
    background-color: rgba(0, 255, 255, 0.2);
    box-shadow: 0 0 25px rgba(0, 255, 255, 0.5) inset, 0 0 25px rgba(0, 255, 255, 0.5);
}

    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="uiContainer">
        <div id="scoreDisplay">Score: 0</div>
        <div id="gameOverScreen" style="display: none;">
            <h1>Game Over</h1>
            <p id="finalScore">Score: 0</p>
            <button id="restartButton">Tap to Restart</button>
        </div>
        <div id="startScreen">
            <h1>Orbital Slingshot</h1>
            <p>Tap and hold to tether.<br>Release to slingshot.</p>
            <p>Climb as high as you can!</p>
            <button id="startButton">Start Game</button>
        </div>
    </div>
    <script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreDisplay = document.getElementById('scoreDisplay');
const startScreen = document.getElementById('startScreen');
const gameOverScreen = document.getElementById('gameOverScreen');
const finalScoreDisplay = document.getElementById('finalScore');
const startButton = document.getElementById('startButton');
const restartButton = document.getElementById('restartButton');

// High DPI Canvas setup
function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    ctx.scale(dpr, dpr);
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas(); // Initial call

// Game State
let gameState = 'start'; // 'start', 'playing', 'gameover'
let score = 0;
let highestY = 0;
let lastTime = 0;
let cameraY = 0;

// Input state
let isPointerDown = false;

// Entities Arrays
let pegs = [];
let obstacles = [];
let particles = [];
let tail = [];

// Player Object
const player = {
    x: window.innerWidth / 2,
    y: window.innerHeight - 200,
    radius: 8,
    vx: 0,
    vy: -400, // Initial upward velocity (pixels per second)
    speed: 400,
    tethered: false,
    tetherPeg: null,
    angle: 0,
    color: '#00ffff'
};

// Main Game Loop
function gameLoop(timestamp) {
    // Calculate delta time in seconds
    let dt = (timestamp - lastTime) / 1000;
    if (isNaN(dt)) dt = 0;
    if (dt > 0.1) dt = 0.1; // Cap delta time to prevent large jumps if tab is inactive
    lastTime = timestamp;

    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

    if (gameState === 'playing') {
        update(dt);
    }

    // Always draw, even if paused/gameover, so the background remains visible
    draw();

    requestAnimationFrame(gameLoop);
}

function update(dt) {
    updateObstacles(dt);

    // Basic placeholder movement for now to test loop
    player.x += player.vx * dt;
    player.y += player.vy * dt;

    // Update camera to follow player upwards
    if (player.y < cameraY + window.innerHeight * 0.5) {
        cameraY = player.y - window.innerHeight * 0.5;
    }

    if (player.tethered && player.tetherPeg) {
        // Centripetal motion around the peg
        let dx = player.x - player.tetherPeg.x;
        let dy = player.y - player.tetherPeg.y;
        let dist = Math.sqrt(dx * dx + dy * dy);

        // Calculate angular velocity (omega = v / r)
        // We use the cross product to determine if it's clockwise or counter-clockwise
        let crossProduct = player.vx * dy - player.vy * dx;
        let direction = crossProduct > 0 ? 1 : -1; // 1 for CCW, -1 for CW (since y is down)

        let omega = (player.speed / dist) * direction;

        // Update angle based on omega
        let currentAngle = Math.atan2(dy, dx);
        let newAngle = currentAngle + omega * dt;

        // Calculate new position
        player.x = player.tetherPeg.x + Math.cos(newAngle) * dist;
        player.y = player.tetherPeg.y + Math.sin(newAngle) * dist;

        // Update velocity vector to be tangent to the circle
        player.vx = -Math.sin(newAngle) * player.speed * direction;
        player.vy = Math.cos(newAngle) * player.speed * direction;
    } else {
        // Linear movement
        player.x += player.vx * dt;
        player.y += player.vy * dt;

        // Wall bounce
        if (player.x - player.radius < 0) {
            player.x = player.radius;
            player.vx *= -1;
        } else if (player.x + player.radius > window.innerWidth) {
            player.x = window.innerWidth - player.radius;
            player.vx *= -1;
        }
    }

    // Update camera to follow player upwards
    if (player.y < cameraY + window.innerHeight * 0.6) {
        cameraY = player.y - window.innerHeight * 0.6;
    }

    // Update score based on height climbed (negative Y is up)
    let currentHeight = -(player.y - (window.innerHeight - 200));
    if (currentHeight > highestY) {
        highestY = currentHeight;
        score = Math.floor(highestY / 10);
        scoreDisplay.innerText = "Score: " + score;
    }

    // Particles and tail update
    if (Math.random() < 0.3) {
        spawnParticle(player.x, player.y, player.color);
    }

    tail.push({x: player.x, y: player.y, alpha: 1});
    if (tail.length > 20) tail.shift();
    for (let t of tail) {
        t.alpha -= dt * 2;
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Procedural Generation
    generateEnvironment();

    // Check Collisions
    checkCollisions();

    // Cleanup off-screen entities (below camera)
    let cleanupY = cameraY + window.innerHeight + 200;
    pegs = pegs.filter(peg => peg.y < cleanupY);
    obstacles = obstacles.filter(obs => obs.y < cleanupY);
}

function checkCollisions() {
    // Obstacle collision
    for (let obs of obstacles) {
        let dx = player.x - obs.x;
        let dy = player.y - obs.y;
        let dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < player.radius + obs.radius) {
            triggerGameOver();
            return;
        }
    }

    // Death storm collision (bottom of screen)
    let stormY = cameraY + window.innerHeight;
    if (player.y > stormY) {
        triggerGameOver();
        return;
    }
}

function triggerGameOver() {
    gameState = 'gameover';

    // Spawn explosion particles
    for (let i = 0; i < 30; i++) {
        spawnParticle(player.x, player.y, player.color);
    }

    // UI Update
    finalScoreDisplay.innerText = "Final Score: " + score;
    gameOverScreen.style.display = 'block';
}

function spawnParticle(x, y, color) {
    particles.push({
        x: x,
        y: y,
        vx: (Math.random() - 0.5) * 100,
        vy: (Math.random() - 0.5) * 100,
        radius: Math.random() * 3 + 1,
        color: color,
        life: Math.random() * 0.5 + 0.2
    });
}

// Procedural Generation
let lastGenY = 0; // The Y coordinate where we last generated elements

function generateEnvironment() {
    // Generate up to 1 screen ahead of the camera
    let targetGenY = cameraY - window.innerHeight;

    while (lastGenY > targetGenY) {
        // Step size for generation
        let step = Math.random() * 150 + 100;
        lastGenY -= step;

        // Decide what to spawn
        if (Math.random() < 0.7) {
            spawnPeg(lastGenY);
        }
        if (Math.random() < 0.4) {
            spawnObstacle(lastGenY);
        }
    }
}

function spawnPeg(y) {
    let x = Math.random() * (window.innerWidth - 100) + 50;
    pegs.push({
        x: x,
        y: y,
        radius: 12,
        active: false,
        color: '#ffffff'
    });
}

function spawnObstacle(y) {
    let x = Math.random() * (window.innerWidth - 60) + 30;
    let radius = Math.random() * 20 + 15;

    // Simple movement for obstacles (horizontal ping-pong)
    let isMoving = Math.random() < 0.5;
    let speed = isMoving ? (Math.random() * 100 + 50) : 0;
    let direction = Math.random() < 0.5 ? 1 : -1;

    obstacles.push({
        x: x,
        y: y,
        radius: radius,
        color: '#ff0055',
        isMoving: isMoving,
        speed: speed,
        direction: direction,
        minX: Math.max(radius, x - 100),
        maxX: Math.min(window.innerWidth - radius, x + 100)
    });
}

function updateObstacles(dt) {
    for (let obs of obstacles) {
        if (obs.isMoving) {
            obs.x += obs.speed * obs.direction * dt;
            if (obs.x < obs.minX) {
                obs.x = obs.minX;
                obs.direction *= -1;
            } else if (obs.x > obs.maxX) {
                obs.x = obs.maxX;
                obs.direction *= -1;
            }
        }
    }
}

function tryTether() {
    if (gameState !== 'playing') return;

    // Find closest peg
    let closestPeg = null;
    let closestDist = Infinity;

    for (let peg of pegs) {
        let dx = player.x - peg.x;
        let dy = player.y - peg.y;
        let dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < closestDist && dist < peg.radius + 150) { // Max tether range
            closestDist = dist;
            closestPeg = peg;
        }
    }

    if (closestPeg) {
        player.tethered = true;
        player.tetherPeg = closestPeg;
        closestPeg.active = true;
    }
}

function untether() {
    if (player.tethered) {
        player.tethered = false;
        if (player.tetherPeg) {
            player.tetherPeg.active = false;
            player.tetherPeg = null;
        }
    }
}

function draw() {
    ctx.save();
    // Apply camera translation
    ctx.translate(0, -cameraY);

    // Global glow effect
    ctx.shadowBlur = 15;

    // Draw Tail
    ctx.beginPath();
    if (tail.length > 0) {
        ctx.moveTo(tail[0].x, tail[0].y);
        for (let i = 1; i < tail.length; i++) {
            ctx.lineTo(tail[i].x, tail[i].y);
        }
        ctx.strokeStyle = `rgba(0, 255, 255, ${Math.max(0, tail[tail.length-1].alpha)})`;
        ctx.lineWidth = player.radius;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.shadowColor = '#00ffff';
        ctx.stroke();
    }

    // Draw Particles
    for (let p of particles) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${p.life})`;
        ctx.shadowColor = p.color;
        ctx.fill();
    }

    // Draw Death Storm (at bottom of camera)
    let stormY = cameraY + window.innerHeight;
    let stormGradient = ctx.createLinearGradient(0, stormY - 100, 0, stormY);
    stormGradient.addColorStop(0, 'rgba(255, 0, 85, 0)');
    stormGradient.addColorStop(1, 'rgba(255, 0, 85, 0.4)');

    ctx.fillStyle = stormGradient;
    ctx.fillRect(0, stormY - 100, window.innerWidth, 200);

    // Draw Pegs
    for (let peg of pegs) {
        ctx.beginPath();
        ctx.arc(peg.x, peg.y, peg.radius, 0, Math.PI * 2);
        ctx.fillStyle = peg.active ? '#00ffff' : peg.color;
        ctx.shadowColor = peg.active ? '#00ffff' : peg.color;
        ctx.shadowBlur = peg.active ? 20 : 10;
        ctx.fill();

        // Draw tether line if active
        if (peg.active && player.tethered) {
            ctx.beginPath();
            ctx.moveTo(player.x, player.y);
            ctx.lineTo(peg.x, peg.y);
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.8)';
            ctx.lineWidth = 3;
            ctx.shadowBlur = 10;
            ctx.stroke();
        }
    }

    // Draw Obstacles
    for (let obs of obstacles) {
        ctx.beginPath();
        ctx.arc(obs.x, obs.y, obs.radius, 0, Math.PI * 2);
        ctx.fillStyle = obs.color;
        ctx.shadowColor = obs.color;
        ctx.shadowBlur = 15;
        ctx.fill();
    }

    // Draw Player (only if alive)
    if (gameState === 'playing' || gameState === 'start') {
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff'; // White core
        ctx.shadowColor = player.color;
        ctx.shadowBlur = 20;
        ctx.fill();
    }

    ctx.restore();
}

function initGame() {
    player.x = window.innerWidth / 2;
    player.y = window.innerHeight - 200;
    player.vx = 0;
    player.vy = -player.speed;
    player.tethered = false;
    player.tetherPeg = null;

    cameraY = 0;
    score = 0;
    highestY = 0;
    scoreDisplay.innerText = "Score: 0";

    pegs = [];
    obstacles = [];
    particles = [];
    tail = [];

    lastGenY = window.innerHeight - 400; // Start generating a bit above the player

    // Initial static pegs to start
    spawnPeg(window.innerHeight - 400);
    spawnPeg(window.innerHeight - 600);

    lastTime = performance.now();
    gameState = 'playing';
}

// Input Listeners
window.addEventListener('mousedown', (e) => {
    // Only tether if clicking on canvas, not UI
    if (e.target === canvas) {
        isPointerDown = true;
        tryTether();
    }
});

window.addEventListener('mouseup', () => {
    isPointerDown = false;
    untether();
});

window.addEventListener('touchstart', (e) => {
    if (e.target === canvas) {
        isPointerDown = true;
        tryTether();
    }
}, {passive: false});

window.addEventListener('touchend', () => {
    isPointerDown = false;
    untether();
});

// UI Listeners
startButton.addEventListener('click', () => {
    startScreen.style.display = 'none';
    initGame();
});

restartButton.addEventListener('click', () => {
    gameOverScreen.style.display = 'none';
    initGame();
});

// Start loop
requestAnimationFrame(gameLoop);

    </script>
</body>
</html>
